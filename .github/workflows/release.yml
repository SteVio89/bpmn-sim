name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build the binaries and
# publish them as a GitHub release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the workspace version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi

  test:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    needs: test
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p sim-gui -p sim-cli

      - name: Package (Linux, macOS)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="bpmn-sim-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/sim-gui target/${{ matrix.target }}/release/sim-cli "$name/"
          cp LICENSE README.md "$name/"
          cp -r third-party "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="bpmn-sim-${GITHUB_REF_NAME}-${{ matrix.target }}"
          release=target/${{ matrix.target }}/release
          # A .app bundle opens without a Terminal window, unlike the bare binary.
          app="$name/BPMN Sim.app"
          mkdir -p "$app/Contents/MacOS"
          cp $release/sim-gui "$app/Contents/MacOS/"
          sed "s/@VERSION@/${GITHUB_REF_NAME#v}/" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          cp $release/sim-cli "$name/"
          cp LICENSE README.md "$name/"
          cp -r third-party "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "bpmn-sim-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/sim-gui.exe, target/${{ matrix.target }}/release/sim-cli.exe $name
          Copy-Item LICENSE, README.md $name
          Copy-Item -Recurse third-party $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
