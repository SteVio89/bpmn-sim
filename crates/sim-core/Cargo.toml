[package]
name = "sim-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Discrete-event simulation of BPMN 2.0 process and collaboration models: parser, engine, statistics"
publish = false

[dependencies]
rand = { version = "0.10.3", default-features = false, features = ["std"] }
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
