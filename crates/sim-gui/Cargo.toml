[package]
name = "sim-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop app for the BPMN process simulator: scenarios, runs, results, diagram view, manual token game"
publish = false

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37.0"
egui_plot = "0.38.0"
flate2 = "1.1.10"
rfd = "0.17.2"
serde_json = "1.0.154"
sha2 = "0.11.1"
sim-core = { version = "0.3.0", path = "../sim-core" }
tar = "0.4.46"
toml = "1.1.8"
ureq = "3.5.0"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
png = "0.18.1"
