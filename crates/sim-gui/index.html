<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPMN Sim</title>
  <meta name="description" content="Simulate BPMN 2.0 process models in the browser: cycle times, waiting times, resource utilisation and costs, model checking and a manual token game. Free and open source.">
  <link data-trunk rel="rust" data-bin="sim-gui" data-wasm-opt="z">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; color: #ddd; }
    @media (prefers-color-scheme: light) { html, body { background: #f8f8f8; color: #222; } }
    canvas#app { position: absolute; inset: 0; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               font: 16px system-ui, sans-serif; padding: 16px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="loading">Loading BPMN Sim…</div>
  <noscript>BPMN Sim needs JavaScript and WebAssembly.</noscript>
</body>
</html>
